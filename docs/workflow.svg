      <text x="392" y="104" fill="#94a3b8">texto + tiempos</text>

      <rect x="480" y="62" width="128" height="62" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="544" y="86" fill="#e2e8f0" font-weight="600">MarianMT</text>
      <text x="544" y="104" fill="#94a3b8">es-MX</text>

      <rect x="632" y="62" width="128" height="62" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="696" y="86" fill="#e2e8f0" font-weight="600">Piper</text>
      <text x="696" y="104" fill="#94a3b8">voz española</text>

      <rect x="784" y="62" width="152" height="62" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="860" y="86" fill="#e2e8f0" font-weight="600">Sincronía + mezcla</text>
      <text x="860" y="104" fill="#94a3b8">atempo · ducking</text>

      <path d="M152 93 H176 M304 93 H328 M456 93 H480 M608 93 H632 M760 93 H784"
            stroke="#38bdf8" stroke-width="2" fill="none"/>
      <path d="M772 88 l12 5 -12 5 z M920 88 l12 5 -12 5 z" fill="#38bdf8"/>

      <rect x="328" y="150" width="304" height="38" rx="8" fill="#0f2a24" stroke="#14532d"/>
