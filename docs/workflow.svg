<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Pipeline de doblaje local">
  <rect width="960" height="210" fill="#0b1120"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="30" fill="#e2e8f0" font-size="18" font-weight="600">Doblaje local: del MP4 original al MP4 en español</text>
    <g font-size="12">
      <rect x="24" y="62" width="128" height="62" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="88" y="86" fill="#e2e8f0" font-weight="600">MP4 original</text>
      <text x="88" y="104" fill="#94a3b8">H.264 + AAC</text>

      <rect x="176" y="62" width="128" height="62" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="240" y="86" fill="#e2e8f0" font-weight="600">FFmpeg</text>
      <text x="240" y="104" fill="#94a3b8">audio 48k / 16k</text>

      <rect x="328" y="62" width="128" height="62" rx="10" fill="#111c33" stroke="#334155"/>
